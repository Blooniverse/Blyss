# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js build & test CI workflow

# Runs for a pull request to main: when it is opened or reopened and when its branch gets new commits ("synchronize").
# Runs for main after every push to it, the merge of a pull request or a commit made directly on main, unless only
# the files below have changed. A commit with [skip ci] in its message starts no run.
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "CHANGELOG.md"
      - "starters/lean/_authoring"
      - "starters/lean/_content"
  pull_request:
    branches: [ "main" ]
    types: [ "opened", "synchronize", "reopened" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
