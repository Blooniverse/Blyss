# Checks the content of every pull request and push with blyss check, the drafts included: a turn of an agent or a
# human that would break the build shows up in the pull request, with its file and its line.
name: Check content

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run check
