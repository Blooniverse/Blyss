<link rel="stylesheet" href="/components/componentFlowchart/componentFlowchart.css">
<script type="module" src="/components/componentFlowchart/componentFlowchart.js"></script>
<component-flowchart class="component" data-library-raphael="{{libraryRaphael}}" data-library-flowchart="{{libraryFlowchart}}" data-line-width="{{lineWidth}}" data-yes="{{yes}}" data-no="{{no}}" data-error="{{error}}">
  <figure>
    <pre tabindex="0">{{content}}</pre>
    <figcaption>{{title}}</figcaption>
  </figure>
</component-flowchart>
