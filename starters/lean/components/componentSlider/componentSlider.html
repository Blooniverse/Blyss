<link rel="stylesheet" href="/components/componentSlider/componentSlider.css">
<script type="module" src="/components/componentSlider/componentSlider.js"></script>
<component-slider class="component">
  <h3><label for="{{id}}-input">{{title}}</label></h3>
  <output for="{{id}}-input" aria-hidden="true">{{value}}</output>
  <input id="{{id}}-input" type="range" min="{{start}}" max="{{end}}" value="{{value}}">
{{steps}}
{{content}}
</component-slider>
