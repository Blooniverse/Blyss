    <div class="book">
{{bookNavigation}}
      <main>
        <article>
          <header>
            <h1>{{title}}</h1>
            <div class="copy-markdown" hidden data-markdown="{{bookMarkdownBase64}}" data-copied="{{markdownCopiedLabel}}" data-failed="{{markdownCopyFailedLabel}}" data-unavailable="{{markdownCopyUnavailableLabel}}">
              <button type="button">{{copyMarkdownLabel}}</button>
              <span role="status"></span>
            </div>
          </header>
{{bookToc}}
{{content}}
        </article>
{{bookPager}}
      </main>
    </div>
    <script src="/assets/js/copy-markdown.js" defer></script>
