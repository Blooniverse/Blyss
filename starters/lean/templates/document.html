<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonicalUrl}}">
{{alternateLinks}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,700;1,400&amp;display=swap">
  <link rel="stylesheet" href="/assets/css/main.css">
{{jsonLd}}
</head>
<body data-kind="{{kind}}" data-align="{{layoutAlign}}" data-align-hero="{{layoutAlignHero}}" style="--site-margin: {{layoutMargin}}; --hero-padding: {{layoutPaddingHero}}">
  <div class="site-bar">
    <a class="logo" href="/{{languageKey}}/"><img src="/assets/img/logo.svg" alt="Blyss" width="93" height="32"></a>
    <nav aria-label="{{mainNavigationLabel}}">
      <ul>
        <li><a href="/{{languageKey}}/">{{homeLabel}}</a></li>
        <li><a href="/{{languageKey}}/posts/">{{postsLabel}}</a></li>
        <li><a href="/{{languageKey}}/tags/">{{tagsLabel}}</a></li>
        <li><a href="/{{languageKey}}/about/">{{aboutLabel}}</a></li>
      </ul>
    </nav>
    <search><input type="search" aria-label="{{searchLabel}}" placeholder="{{searchLabel}}"></search>
    {{languageSwitcher}}
  </div>
  <div class="page">
{{content}}
  </div>
  <aside class="overlay" aria-label="{{overlayLabel}}">
    <button class="overlay-toggle" type="button" popovertarget="overlay">{{overlayLabel}} <span aria-hidden="true">⤒</span></button>
    <div id="overlay" popover>
      <button class="overlay-toggle" type="button" popovertarget="overlay" popovertargetaction="hide">{{closeLabel}} <span aria-hidden="true">⤓</span></button>
{{heroComponentSlider}}
{{heroComponentGallery}}
      <h3>{{heroTitle}}</h3>
      <div class="hero-texts">
{{heroTexts}}
      </div>
    </div>
  </aside>
  <footer><small>{{generatedByLabel}}</small></footer>
</body>
</html>
