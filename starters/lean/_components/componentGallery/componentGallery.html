<link rel="stylesheet" href="/_components/componentGallery/componentGallery.css">
<script type="module" src="/_components/componentGallery/componentGallery.js"></script>
<component-gallery class="component" role="group" aria-labelledby="{{id}}-title" style="--height-overall: {{heightOverall}}; --scale-center: {{scaleCenter}}; --height-expanded: {{heightExpanded}}; --speed-scrolling: {{animationSpeedScrolling}}; --speed-enlargement: {{animationSpeedImgEnlargement}}">
  <h3 id="{{id}}-title">{{title}}</h3>
  <div class="stage">
    <button type="button" aria-label="{{previous}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
{{content}}
    <button type="button" aria-label="{{next}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
  </div>
</component-gallery>
