<link rel="stylesheet" href="/_components/componentFlower/componentFlower.css">
<script type="module" src="/_components/componentFlower/componentFlower.js"></script>
<component-flower class="component" role="group" aria-labelledby="{{id}}-title" style="--hue-petals: {{huePetals}}; --hue-centre: {{hueCentre}}; --hue-stem: {{hueStem}}; --petal-width: {{petalWidth}}; --speed-falling: {{animationSpeedFalling}}; --speed-text: {{animationSpeedText}}; --speed-fading: {{animationSpeedFading}}; --opacity-fallen: {{opacityFallen}}; --font-size-text: {{fontSizeText}}">
  <h3 id="{{id}}-title">{{title}}</h3>
  <div class="flower">
    <svg class="stem" viewBox="0 0 30 90" aria-hidden="true"><path d="M15 0C19 30 11 60 15 90"/><path d="M15 76Q17 61 29 58 28 72 15 76Z"/></svg>
{{petalItems}}
    <span class="centre"></span>
  </div>
  <ol class="texts" aria-live="polite">
{{textItems}}
  </ol>
  <div class="ground" aria-hidden="true">
{{groundItems}}
  </div>
</component-flower>
